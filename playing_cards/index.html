<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  <link href="styles.css" rel="stylesheet">

</head>

<body>
  <main id="playing-cards">
    <div class="card one">
      <div class="left">
        <p>A</p>
        <p>♠</p>
      </div>
      <div class="middle" >
        <p>♠</p>
      </div>
      <div class="right">
        <p>A</p>
        <p>♠</p>
      </div>
    </div>    
        
    <div class="card two">
      <div class="left">
        <p>2</p>
        <p>♣</p>
      </div>
      <div class="middle">
        <p>♣</p>
        <p>♣</p>
      </div>
      <div class="right">
        <p>2</p>
        <p>♣</p>
      </div>
    </div>

    <div class="card three">
      <div class="left">
        <p>3</p>
        <p>♥</p>
      </div>
      <div class="middle">
        <p>♥</p>
        <p>♥</p>
        <p>♥</p>
      </div>
      <div class="right">
        <p>3</p>
        <p>♥</p>
      </div>
    </div>

    <div class="card afour">
      <div class="left">
        <p>4</p>
        <p>♣</p>
      </div>
      <div class="middle">
        <div class="haut">
          <p>♣</p>
          <p>♣</p>
        </div> 
        <div class="bas">
          <p>♣</p>
          <p>♣</p>
        </div>
      </div>
      <div class="right">
        <p>4</p>
        <p>♣</p>
      </div>
    </div>

    <div class="card five">
      <div class="left">
        <p>5</p>
        <p>♦</p>
      </div>
      <div class="middle">
        <div class="haut">
          <p>♦</p>
          <p>♦</p>
        </div>
        <div class="milieu">
          <p>♦</p>
        </div>  
        <div class="bas">
          <p>♦</p>
          <p>♦</p>
        </div>
      </div>
      <div class="right">
        <p>5</p>
        <p>♦</p>
      </div>
    </div>
  </main>

</body>

</html>
